name: Playwright BDD Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Spotless Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # google-java-format 1.27.0 (via Spotless) needs a JDK that can load Java 17
          # class files to *run*; the project's own compiled bytecode target (11, in
          # pom.xml) is unaffected by this.
          java-version: "17"
          cache: maven

      - name: Check code formatting (Google Java Format / AOSP)
        run: mvn -q spotless:check

  test:
    name: Run BDD Scenarios (Headless)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # google-java-format 1.27.0 (via Spotless) needs a JDK that can load Java 17
          # class files to *run*; the project's own compiled bytecode target (11, in
          # pom.xml) is unaffected by this.
          java-version: "17"
          cache: maven

      - name: Resolve Playwright version from pom.xml
        id: playwright-version
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=playwright.version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Playwright browsers (chromium + OS deps)
        run: npx -y playwright@${{ steps.playwright-version.outputs.version }} install --with-deps chromium

      # Only the dbvi project runs on every commit (the real testmms.na.dadabhagwan.org
      # scenario). The `example` module is just the framework's own template/reference
      # project, not something we need to verify in CI here.
      - name: Run MMS Member Portal login scenario (project=dbvi)
        run: |
          mvn test \
            -Dcucumber.filter.tags="@MMS_REGRESSION" \
            -Dproject-name=dbvi \
            -Denv=QA \
            -Durl="https://testmms.na.dadabhagwan.org/" \
            -Dheadless=true \
            -Dread-credentials-from-db=false \
            -Dperfecto.enabled=false \
            -Drp.enable=false

      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 14
          if-no-files-found: warn

      - name: Fetch previous Allure history (for trend graphs)
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      # actions/checkout leaves a .git dir in gh-pages/ even when the ref doesn't exist yet
      # (first-ever deploy) or on a normal successful checkout. simple-elf/allure-report-action
      # copies the whole gh-pages/ folder forward into allure-history, .git included, which
      # then corrupts peaceiris/actions-gh-pages' own git operations on the next step ("src
      # refspec gh-pages does not match any" on push). Strip it before the report is generated.
      - name: Remove stray .git from fetched Allure history
        if: always()
        run: rm -rf gh-pages/.git

      - name: Generate Allure HTML report
        if: always()
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: target/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: Upload generated Allure report (build artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-history
          retention-days: 14
          if-no-files-found: warn

      - name: Publish Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          # gh-pages doesn't exist yet on a first deploy; the action's clone-then-fallback
          # branch-detection can end up with nothing to commit in that case ("src refspec
          # gh-pages does not match any" on push). force_orphan sidesteps that entirely by
          # always building a fresh orphan commit from publish_dir. Allure's own trend/history
          # graphs are unaffected since that data lives in the last-history files simple-elf
          # already carries forward, not in git commit history.
          force_orphan: true
